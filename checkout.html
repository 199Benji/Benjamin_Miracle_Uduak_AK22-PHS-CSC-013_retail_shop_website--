<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZestMarket | Secure Checkout</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background: #f8fafc; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .checkout-box { background: #ffffff; padding: 40px; border-radius: 20px; border: 1px solid #e2e8f0; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        h2 { color: #0f172a; margin-bottom: 5px; font-weight: 800; }
        .amount-display { background: #f1f5f9; padding: 20px; border-radius: 12px; font-size: 24px; font-weight: 800; color: #2563eb; margin: 25px 0; border: 1px dashed #cbd5e1; }
        form { text-align: left; }
        label { display: block; font-size: 13px; font-weight: 600; color: #64748b; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn-pay { background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-cancel { display: block; text-align: center; color: #64748b; font-size: 13px; margin-top: 15px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="checkout-box">
        <h2>Secure Order Settlement</h2>
        <p style="color:#64748b; font-size:14px;">Complete your transaction securely below.</p>
        
        <div class="amount-display"><span id="payable-amount">0</span> NGN</div>

        <form onsubmit="event.preventDefault(); alert('Payment Transaction Logged Successfully.'); window.location.href='index.html';">
            <label>Cardholder Full Name</label>
            <input type="text" placeholder="Miracle" required>
            
            <label>Card Number</label>
            <input type="text" placeholder="0000 0000 0000 0000" maxlength="19" required>
            
            <button type="submit" class="btn-pay">Authorize Settlement</button>
        </form>
        
        <a href="shop.html" class="btn-cancel">← Cancel and Return</a>
    </div>

    <script>
        // Extract parameter tokens out of the window URL address
        const urlParams = new URLSearchParams(window.location.search);
        const billTotal = urlParams.get('amount') || '0';
        
        // Print total to screen with clean localized decimal strings
        document.getElementById('payable-amount').innerText = Number(billTotal).toLocaleString();
    </script>
</body>
</html>
