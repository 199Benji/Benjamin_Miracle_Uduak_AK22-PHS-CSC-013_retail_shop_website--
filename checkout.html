<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZestMarket | Secure Checkout & Customer Query</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            background: #f8fafc; 
            color: #334155; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
        }
        .container { width: 100%; max-width: 500px; }
        .checkout-box { 
            background: #ffffff; 
            padding: 35px; 
            border-radius: 20px; 
            border: 1px solid #e2e8f0; 
            width: 100%; 
            text-align: center; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); 
            margin-bottom: 30px;
            box-sizing: border-box;
        }
        h2 { color: #0f172a; margin-bottom: 5px; font-weight: 800; font-size: 22px; }
        .amount-display { background: #f1f5f9; padding: 15px; border-radius: 12px; font-size: 22px; font-weight: 800; color: #2563eb; margin: 20px 0; border: 1px dashed #cbd5e1; }
        form { text-align: left; }
        label { display: block; font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; }
        .btn-pay { background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-cancel { display: block; text-align: center; color: #64748b; font-size: 13px; margin-top: 15px; text-decoration: none; }
        
        /* Query Section Styles */
        .query-box { text-align: left; }
        .search-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .search-row input { margin-bottom: 0; flex: 1; }
        .btn-query { background: #0f172a; color: white; border: none; padding: 0 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .result-card { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 4px solid #2563eb; padding: 12px 15px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
        .result-card strong { color: #0f172a; }
        .no-result { color: #ef4444; font-size: 13px; font-weight: 600; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- SECTION 1: CHECKOUT FORM -->
        <div class="checkout-box">
            <h2>Secure Order Settlement</h2>
            <p style="color:#64748b; font-size:13px;">Complete your transaction and register your order.</p>
            
            <div class="amount-display"><span id="payable-amount">0</span> NGN</div>

            <form id="checkoutForm">
                <label>Cardholder / Customer Name</label>
                <input type="text" id="cust_name" placeholder="Miracle Benjamin" required>
                
                <label>Customer Email Address</label>
                <input type="email" id="cust_email" placeholder="miracle@example.com" required>

                <label>Delivery Location / Address</label>
                <input type="text" id="cust_location" placeholder="e.g. 15 Housing Estate, Uyo" required>
                
                <label>Card Number (Masked)</label>
                <input type="text" id="cust_card" placeholder="1234 5678 9012 3456" maxlength="19" required>
                
                <button type="submit" id="payBtn" class="btn-pay">Authorize Settlement & Save Order</button>
            </form>
            
            <a href="shop.html" class="btn-cancel">← Cancel and Return</a>
        </div>

        <!-- SECTION 2: QUERY CUSTOMER INFO -->
        <div class="checkout-box query-box">
            <h2>Query Customer Database</h2>
            <p style="color:#64748b; font-size:13px; margin-bottom: 15px;">Search customer records live from Firebase Firestore:</p>
            
            <div class="search-row">
                <input type="text" id="search_query" placeholder="Enter Customer Name or Email...">
                <button type="button" class="btn-query" onclick="queryDatabase()">Search</button>
            </div>

            <div id="query_results"></div>
        </div>

    </div>

    <script type="module">
        // Import Firebase SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        // Your ZestMarket Portfolio Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBFj-XqJAB7TaxZ5UplezYwcoeCcu0L1J0",
            authDomain: "zestmarket-portfolio.firebaseapp.com",
            projectId: "zestmarket-portfolio",
            storageBucket: "zestmarket-portfolio.firebasestorage.app",
            messagingSenderId: "952738167807",
            appId: "1:952738167807:web:73a5cc39b929c3842885ca",
            measurementId: "G-6T5NPWHSYW"
        };

        // Initialize Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Get Amount from URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const billTotal = urlParams.get('amount') || '0';
        document.getElementById('payable-amount').innerText = Number(billTotal).toLocaleString();

        // 1. SAVE CUSTOMER ORDER TO FIREBASE FIRESTORE
        document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('payBtn');
            btn.textContent = "Processing & Saving Order...";
            btn.disabled = true;

            const nameInput = document.getElementById('cust_name').value.trim();
            const emailInput = document.getElementById('cust_email').value.trim().toLowerCase();
            const locationInput = document.getElementById('cust_location').value.trim();
            const cardInput = document.getElementById('cust_card').value.trim();

            const newOrder = {
                order_id: "ORD-" + Math.floor(100000 + Math.random() * 900000),
                customer_name: nameInput,
                customer_email: emailInput,
                delivery_location: locationInput,
                amount_paid: Number(billTotal).toLocaleString() + " NGN",
                card_number: cardInput.slice(-4) ? "**** **** **** " + cardInput.slice(-4) : "****",
                timestamp: new Date().toLocaleString(),
                createdAt: new Date()
            };

            try {
                // Add order into a "zestmarket_orders" collection in Firestore
                await addDoc(collection(db, "zestmarket_orders"), newOrder);
                alert(`Payment Successful! Order Logged into Database.\nOrder ID: ${newOrder.order_id}`);
                document.getElementById('checkoutForm').reset();
            } catch (err) {
                console.error("Firebase write error:", err);
                alert("Database write error. Check your network or Firestore rules.");
            } finally {
                btn.textContent = "Authorize Settlement & Save Order";
                btn.disabled = false;
            }
        });

        // 2. QUERY & SEE CUSTOMER INFORMATION FROM FIRESTORE
        window.queryDatabase = async function() {
            const searchQuery = document.getElementById('search_query').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('query_results');
            resultsDiv.innerHTML = "<p style='color:#64748b; font-size:13px;'>Searching database...</p>";

            if (!searchQuery) {
                resultsDiv.innerHTML = "<p class='no-result'>Please enter a customer name or email to search.</p>";
                return;
            }

            try {
                const q = query(collection(db, "zestmarket_orders"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                const allOrders = querySnapshot.docs.map(doc => doc.data());

                // Filter records matching name, email, or order ID
                const matches = allOrders.filter(order => 
                    order.customer_name.toLowerCase().includes(searchQuery) || 
                    order.customer_email.toLowerCase().includes(searchQuery) ||
                    order.order_id.toLowerCase().includes(searchQuery)
                );

                resultsDiv.innerHTML = "";

                if (matches.length === 0) {
                    resultsDiv.innerHTML = "<p class='no-result'>No customer records found matching your query.</p>";
                    return;
                }

                // Render matched records including delivery location
                matches.forEach(order => {
                    const card = document.createElement('div');
                    card.className = "result-card";
                    card.innerHTML = `
                        <div><strong>Customer Name:</strong> ${order.customer_name}</div>
                        <div><strong>Email:</strong> ${order.customer_email}</div>
                        <div><strong>Delivery Location:</strong> ${order.delivery_location || 'N/A'}</div>
                        <div><strong>Amount Paid:</strong> ${order.amount_paid}</div>
                        <div><strong>Order ID:</strong> ${order.order_id} | <strong>Card:</strong> ${order.card_number}</div>
                        <div style="font-size:11px; color:#94a3b8; margin-top:4px;">Recorded: ${order.timestamp}</div>
                    `;
                    resultsDiv.appendChild(card);
                });
            } catch (err) {
                console.error("Query error:", err);
                resultsDiv.innerHTML = "<p class='no-result'>Could not connect to database.</p>";
            }
        }
    </script>
</body>
</html>
